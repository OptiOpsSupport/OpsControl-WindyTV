<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Windy Auto-Refresh</title>
  <!-- Full page reload every 300 s (5 min) as a fallback -->
  <meta http-equiv="refresh" content="300">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    iframe { border: 0; width: 100vw; height: 100vh; display: block; }
  </style>
</head>
<body>
  <iframe id="windy"
    src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=mm&metricTemp=%C2%B0C&metricWind=m%2Fs&zoom=5&overlay=wind&product=ecmwf&level=surface&lat=54.572&lon=-4.175&message=true">
  </iframe>
</body>
</html>
